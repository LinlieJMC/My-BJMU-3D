<style>

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0f1f;color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
  canvas{display:block;touch-action:none}
  .panel{position:fixed;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:12px}
  #title{left:16px;top:16px;padding:12px 16px;max-width:min(340px,calc(100vw - 110px))}
  #title h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.04em}
  #title p{margin:4px 0 0;font-size:12px;color:var(--dim);line-height:1.5}
  #compass{right:16px;top:16px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center}
  #needle{width:100%;height:100%;display:grid;place-items:start center;padding-top:5px;font-size:12px;font-weight:700;color:var(--accent)}
  #needle::after{content:"";position:absolute;left:50%;top:22px;width:2px;height:14px;margin-left:-1px;background:var(--accent);border-radius:1px}
  #bar{left:50%;bottom:16px;transform:translateX(-50%);padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px 14px;
    align-items:center;justify-content:center;width:max-content;max-width:calc(100vw - 24px)}
  .grp{display:flex;align-items:center;gap:6px}
  .grp>span{font-size:12px;color:var(--dim);margin-right:2px;white-space:nowrap}
  button{font:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);
    border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap}
  button:hover{background:rgba(255,255,255,.14)}
  button.on{background:var(--accent);border-color:var(--accent);color:#1b1407;font-weight:600}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input[type=range]{width:170px;accent-color:var(--accent)}
  #clock{font-variant-numeric:tabular-nums;font-size:13px;min-width:44px;text-align:center}
  #info{right:16px;top:86px;padding:10px 14px;font-size:12px;line-height:1.7;max-width:250px;display:none}
  #info b{font-size:14px;display:block;margin-bottom:2px}
  #info i{font-style:normal;color:var(--accent)}
  #hint{left:16px;bottom:96px;padding:8px 12px;font-size:12px;color:var(--dim);line-height:1.6;max-width:260px}
  #fwd{right:20px;bottom:110px;width:64px;height:64px;border-radius:50%;display:none;font-size:22px}
  #credit{position:fixed;right:10px;bottom:4px;font-size:10px;color:rgba(255,255,255,.55);text-shadow:0 1px 2px #000}
  #err{left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 22px;display:none;max-width:320px;font-size:14px;line-height:1.6}
  @media (max-width:640px){#hint{display:none}input[type=range]{width:120px}#title p{display:none}}
</style>

cv.addEventListener('pointerdown',e=>{if(mode=='walk'){drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);}});
cv.addEventListener('pointermove',e=>{if(mode=='walk'&&drag){yaw-=(e.clientX-drag[0])*.004;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-drag[1])*.004));drag=[e.clientX,e.clientY];}});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>drag=null));
const ray=new THREE.Raycaster(),info=document.getElementById('info');let downAt=null;
const SRC={O:'官方公布',C:'公开资料／按官方面积推算',S:'卫星影像阴影测高（约 ±15%）',U:'你的实地确认',E:'估算，待校正'};
cv.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY];});
cv.addEventListener('pointerup',e=>{if(mode!='orbit'||!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5)return;
  ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),camera);const hit=ray.intersectObjects(bMeshes)[0];
  if(!hit){info.style.display='none';return;}const u=hit.object.userData;info.textContent='';
  const b=document.createElement('b');b.textContent=u.name||(u.cat=='X'?'周边建筑':'校内建筑（地图未标名）');info.appendChild(b);
  info.appendChild(document.createTextNode('地上 '+u.lv+' 层 · 模型高 '+u.h.toFixed(1)+' m'));info.appendChild(document.createElement('br'));
  const i=document.createElement('i');i.textContent='层数依据：'+SRC[u.src];info.appendChild(i);info.style.display='block';});
fwd.addEventListener('pointerdown',e=>{keys.KeyW=true;e.preventDefault();});['pointerup','pointercancel','pointerleave'].forEach(t=>fwd.addEventListener(t,()=>keys.KeyW=false));
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();applySeason();

const needle=document.getElementById('needle'),dir=new THREE.Vector3();let last=performance.now();
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){hour=(hour+dt*.6)%24;document.getElementById('time').value=hour;applySky();}
  if(mode=='walk'){const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
    if(f||s){const sp=(keys.ShiftLeft||keys.ShiftRight?12:4.5)*dt/Math.hypot(f,s);const fx=Math.sin(yaw),fy=Math.cos(yaw);
      const dx=(fx*f+fy*s)*sp,dy=(fy*f-fx*s)*sp;let x=camera.position.x,y=-camera.position.z;
      if(!inBlock(x+dx,y+dy)){x+=dx;y+=dy;}else if(!inBlock(x+dx,y))x+=dx;else if(!inBlock(x,y+dy))y+=dy;
      camera.position.set(Math.max(-580,Math.min(580,x)),1.65,-Math.max(-430,Math.min(430,y)));}
    camera.rotation.order='YXZ';camera.rotation.set(pitch,-yaw,0);}
  else orbit.update();
  camera.getWorldDirection(dir);needle.style.transform='rotate('+(-Math.atan2(dir.x,-dir.z))+'rad)';
  for(const l of labels)l.visible=showLab&&(mode=='orbit'||l.position.distanceTo(camera.position)<240);
  renderer.render(scene,camera);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
